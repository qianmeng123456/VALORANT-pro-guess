<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4655"/>
      <stop offset="100%" stop-color="#cc3543"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0f1923" stroke="#ff4655" stroke-width="4"/>
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#ff4655" stroke-width="2" opacity="0.6"/>
  <!-- Crosshair top -->
  <rect x="47" y="22" width="6" height="16" rx="2" fill="#ff4655"/>
  <!-- Crosshair bottom -->
  <rect x="47" y="62" width="6" height="16" rx="2" fill="#ff4655"/>
  <!-- Crosshair left -->
  <rect x="22" y="47" width="16" height="6" rx="2" fill="#ff4655"/>
  <!-- Crosshair right -->
  <rect x="62" y="47" width="16" height="6" rx="2" fill="#ff4655"/>
  <!-- Center question mark -->
  <text x="50" y="58" text-anchor="middle" fill="#ece8e1" font-family="Arial,sans-serif" font-size="30" font-weight="bold">?</text>
</svg>
